name: Tests, data update and site deploy

# Tests run on every push and pull request.
# The league pipeline + GitHub Pages deploy only run when the repository variable
# LEAGUE_ID is set (Settings → Secrets and variables → Actions → Variables), so a
# fork or template with no league configured never publishes anything.
#
# League data is never committed: snapshots (needed to spot what changed since the
# last run) are kept in the Actions cache between runs.

on:
  schedule:
    # GitHub cron runs in UTC. 08:00 UTC Tue + Fri is after Monday and Thursday night
    # games finish (latest ~06:30 UTC) all season. Pick times that suit your timezone.
    - cron: "0 8 * * 2,5"
  workflow_dispatch: # "Run workflow" button on the Actions tab
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read        # least privilege; only the deploy job gets more (below)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync
      - run: uv run pytest -q

  update:
    needs: test
    if: vars.LEAGUE_ID != '' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write      # publish to GitHub Pages
      id-token: write   # required by deploy-pages
    timeout-minutes: 15
    env:
      LEAGUE_ID: ${{ vars.LEAGUE_ID }}
      SLEEPER_USERNAME: ${{ vars.SLEEPER_USERNAME }}
      LEAGUE_TIMEZONE: ${{ vars.LEAGUE_TIMEZONE }}
      NICKNAMES: ${{ vars.NICKNAMES }}
      TARGETS: ${{ vars.TARGETS }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync

      - name: Restore previous snapshots
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: data/
          key: league-data-${{ github.run_id }}
          restore-keys: league-data-

      - name: Run pipeline
        run: uv run python -m nfl_assistant.run

      - name: Save snapshots for next run
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: data/
          key: league-data-${{ github.run_id }}

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
