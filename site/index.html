<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fantasy">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Fantasy NFL Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <h1 id="team-name">Fantasy NFL Assistant</h1>
        <p class="sub" id="subtitle">Loading…</p>
      </div>
      <div class="top-actions">
        <button id="install-btn" type="button" hidden>Install</button>
        <button class="icon-btn" id="refresh-btn" type="button" aria-label="Reload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>
      </div>
    </div>
  </header>

  <main>
    <div id="status"></div>
    <div id="warnings"></div>
    <div id="subnav"></div>
    <section id="tab-home" class="tab-panel"></section>
    <section id="tab-league" class="tab-panel" hidden></section>
    <section id="tab-faab" class="tab-panel" hidden></section>
    <section id="tab-news" class="tab-panel" hidden></section>
    <section id="tab-trades" class="tab-panel" hidden></section>
    <section id="tab-lab" class="tab-panel" hidden></section>
    <section id="tab-planner" class="tab-panel" hidden></section>
    <section id="tab-brief" class="tab-panel" hidden></section>
    <section id="tab-more" class="tab-panel" hidden></section>
  </main>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="home" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg><span>Home</span></button>
    <button role="tab" data-tab="league"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 6H4a3 3 0 0 0 3 4"/><path d="M17 6h3a3 3 0 0 1-3 4"/></svg><span>League</span></button>
    <button role="tab" data-tab="waivers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .9-3 2.2 0 3 6 1.6 6 4.6 0 1.3-1.3 2.2-3 2.2-1.4 0-2.6-.6-3-1.6"/><path d="M12 6.5V8m0 9v1.5"/></svg><span>Waivers</span></button>
    <button role="tab" data-tab="trades"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13"/><path d="m13 4 4 4-4 4"/><path d="M20 16H7"/><path d="m11 20-4-4 4-4"/></svg><span>Trades</span></button>
    <button role="tab" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg><span>More</span></button>
  </nav>

  <footer class="foot" id="footer"></footer>

  <!-- Data files are written by the pipeline (uv run python -m nfl_assistant.run). -->
  <script src="data/dashboard.js"></script>
  <script src="data/faab.js"></script>
  <script src="data/scanner.js"></script>
  <script src="data/trades.js"></script>
  <script src="data/outlook.js"></script>
  <script src="data/lab.js"></script>
  <script src="data/league.js"></script>
  <script src="lab.js"></script>
  <script src="data/brief.js"></script>
  <script src="app.js"></script>
</body>
</html>
