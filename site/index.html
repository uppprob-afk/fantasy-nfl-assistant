<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fantasy">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Fantasy NFL Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <h1 id="team-name">Fantasy NFL Assistant</h1>
        <p class="sub" id="subtitle">Loading…</p>
      </div>
      <div class="top-actions">
        <button class="theme-btn" id="install-btn" type="button" hidden>Install</button>
        <button class="theme-btn" id="refresh-btn" type="button" aria-label="Reload">↻</button>
        <button class="theme-btn" id="theme-btn" type="button" aria-label="Toggle dark mode">◐</button>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist">
      <button role="tab" data-tab="home" aria-selected="true">Home</button>
      <button role="tab" data-tab="league">League</button>
      <button role="tab" data-tab="news">News</button>
      <button role="tab" data-tab="faab">FAAB</button>
      <button role="tab" data-tab="trades">Trades</button>
      <button role="tab" data-tab="lab">Trade Lab</button>
      <button role="tab" data-tab="planner">Planner</button>
      <button role="tab" data-tab="brief">Brief</button>
    </nav>
  </header>

  <main>
    <div id="status"></div>
    <div id="warnings"></div>
    <section id="tab-home" class="tab-panel"></section>
    <section id="tab-league" class="tab-panel" hidden></section>
    <section id="tab-news" class="tab-panel" hidden></section>
    <section id="tab-faab" class="tab-panel" hidden></section>
    <section id="tab-trades" class="tab-panel" hidden></section>
    <section id="tab-lab" class="tab-panel" hidden></section>
    <section id="tab-planner" class="tab-panel" hidden></section>
    <section id="tab-brief" class="tab-panel" hidden></section>
  </main>

  <footer class="foot" id="footer"></footer>

  <!-- Data files are written by the pipeline (uv run python -m nfl_assistant.run). -->
  <script src="data/dashboard.js"></script>
  <script src="data/faab.js"></script>
  <script src="data/scanner.js"></script>
  <script src="data/trades.js"></script>
  <script src="data/outlook.js"></script>
  <script src="data/lab.js"></script>
  <script src="data/league.js"></script>
  <script src="lab.js"></script>
  <script src="data/brief.js"></script>
  <script src="app.js"></script>
</body>
</html>
